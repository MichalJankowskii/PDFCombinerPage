<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PDF Combiner logo">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#c62828"/>
  <!-- Two stacked document shapes -->
  <rect x="10" y="12" width="28" height="36" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="16" y="16" width="28" height="36" rx="3" fill="white"/>
  <!-- Page fold on top doc -->
  <polygon points="36,16 44,16 44,24" fill="#e5e7eb"/>
  <!-- Text lines on document -->
  <rect x="20" y="26" width="16" height="2.5" rx="1.25" fill="#c62828" opacity=".4"/>
  <rect x="20" y="31" width="12" height="2.5" rx="1.25" fill="#c62828" opacity=".4"/>
  <rect x="20" y="36" width="14" height="2.5" rx="1.25" fill="#c62828" opacity=".4"/>
  <!-- Merge arrow (small plus) -->
  <circle cx="50" cy="50" r="11" fill="#8e0000"/>
  <rect x="44.5" y="48.5" width="11" height="3" rx="1.5" fill="white"/>
  <rect x="48.5" y="44.5" width="3" height="11" rx="1.5" fill="white"/>
</svg>
